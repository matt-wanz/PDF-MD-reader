name: Build and Release Windows EXE

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 编译环境
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 编译极速轻量版 (约3MB，推荐日常使用)
        run: |
          dotnet publish DocViewer.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o ./output/Light
          Move-Item ./output/Light/DocViewer.exe ./output/DocViewer-Light.exe

      - name: 编译免安装独立版 (内置运行时并开启压缩，约55MB)
        run: |
          dotnet publish DocViewer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o ./output/Standalone
          Move-Item ./output/Standalone/DocViewer.exe ./output/DocViewer-Standalone.exe

      - name: 发布成品到 GitHub Releases 页面
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 轻阅 PDF & Markdown 阅读/编辑器 v1.0.${{ github.run_number }}
          make_latest: true
          files: |
            ./output/DocViewer-Light.exe
            ./output/DocViewer-Standalone.exe
